<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2D2A26" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Absurd Mini Golf</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #23201d;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      #game canvas {
        display: block;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        gap: 18px;
        background: #23201d;
        color: #e9e3d8;
        z-index: 10;
        transition: opacity 0.35s ease;
        pointer-events: none;
      }
      #boot.gone {
        opacity: 0;
      }
      #boot .mark {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        background: #fff;
        border: 3px solid #2d2a26;
        box-shadow: 0 8px 0 rgba(0, 0, 0, 0.28);
        animation: hop 1s cubic-bezier(0.3, 0, 0.4, 1) infinite;
      }
      #boot .label {
        font-size: 13px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        opacity: 0.6;
      }
      @keyframes hop {
        0%,
        100% {
          transform: translateY(0) scale(1, 1);
        }
        40% {
          transform: translateY(-26px) scale(0.94, 1.06);
        }
        70% {
          transform: translateY(0) scale(1.1, 0.9);
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="boot"><div><div class="mark"></div></div><div class="label">Absurd Mini Golf</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
